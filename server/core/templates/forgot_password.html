<!DOCTYPE html>
<html>
<head>
    <title>FORGOT PASSWORD</title>

    <style>
        body{
            background:#1900A8;
            font-family:Arial;
        }

        h1{
            color:#EFDD30;
            text-align:center;
            margin-top:80px;
        }

        form{
            width:300px;
            margin:40px auto;
            background:#2a2fff;
            padding:20px;
            border-radius:10px;
            color:white;
        }

        input{
            width:100%;
            margin:10px 0;
            padding:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:#EFDD30;
            border:none;
            font-weight:bold;
            color:#1900A8;
        }

        p{
            text-align:center;
            color:white;
        }

        .error{
            color:red;
        }

        a{
            color:white;
        }

        footer{
            margin-top: 40px;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>FORGOT PASSWORD?</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% if message %}
<p>{{ message }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input name="email" type="email" placeholder="email" required>
    <button>SEND CODE</button>
</form>

<p><a href="{% url 'login' %}">Back to login</a></p>

<footer>
    <a href="{% url 'home_page' %}">home</a>
</footer>

</body>
</html>
