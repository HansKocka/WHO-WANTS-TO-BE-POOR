<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: #1900A8;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
        }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            margin: 0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .top-right a,
        .top-right button,
        .menu-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 12px 22px;
            background: #EFDD30;
            color: #1900A8;
            border: 3px solid #EFDD30;
            border-radius: 8px;
            text-decoration: none;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #0D0067;
            transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }

        .top-right a:hover,
        .top-right button:hover,
        .menu-button:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #0D0067;
        }

        .top-right a:active,
        .top-right button:active,
        .menu-button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0D0067;
        }

        .top-right form {
            margin: 0;
        }

        main {
            width: min(720px, calc(100% - 32px));
            margin: 96px auto 48px;
            text-align: center;
        }

        h1 {
            margin: 0 0 42px;
            color: #EFDD30;
            font-size: clamp(38px, 8vw, 76px);
            line-height: 0.95;
            font-weight: 900;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 22px;
        }

        .menu-button {
            width: 100%;
            min-height: 82px;
            font-size: clamp(24px, 5vw, 40px);
        }

        footer {
            margin-top: auto;
            padding: 24px;
            text-align: center;
        }

        footer a {
            margin: 0 10px;
            color: white;
            font-size: 18px;
        }

        footer p {
            margin: 14px 0 0;
            color: white;
        }

        @media (max-width: 560px) {
            .top-right {
                position: static;
                justify-content: flex-end;
                padding: 16px;
            }

            .top-right a,
            .top-right button {
                min-height: 48px;
                padding: 10px 14px;
                font-size: 18px;
            }

            main {
                margin-top: 28px;
            }

            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="top-right">
        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">LOGOUT</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">LOGIN</a>
            <a href="{% url 'register' %}">REGISTER</a>
        {% endif %}
    </div>

    <main>
        <h1>WHO WANTS TO BE POOR</h1>
        <nav class="menu" aria-label="Main menu">
            <a class="menu-button" href="{% url 'create' %}">CREATE</a>
            <a class="menu-button" href="{% url 'quiz' %}">QUIZZES</a>
            <a class="menu-button" href="{% url 'my_quizzes' %}">MY QUIZZES</a>
            <a class="menu-button" href="{% url 'join' %}">JOIN</a>
        </nav>
    </main>

    <footer>
        <a href="{% url 'about_page' %}">about</a>
        <a href="{% url 'contact_page' %}">contact</a>
        <p>&copy; 2026 Who Wants To Be Poor</p>
    </footer>
</body>
</html>
