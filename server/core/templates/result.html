<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ quiz.title }} | Result</title>
    <style>
        body {
            margin: 0;
            background: #1900A8;
            color: white;
            font-family: Arial, sans-serif;
        }
        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            width: min(560px, 100%);
            padding: 32px;
            border-radius: 20px;
            background: rgba(77, 98, 245, 0.35);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #EFDD30;
        }
        .score {
            font-size: 56px;
            font-weight: bold;
            color: #EFDD30;
            margin: 18px 0;
        }
        .label {
            color: #d9ddff;
        }
        .link {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            background: #EFDD30;
            color: #1900A8;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>{{ quiz.title }}</h1>
            {% if player %}
            <p class="label">Player: {{ player.name }}</p>
            <div class="score">{{ player.score }}</div>
            <p class="label">Total points</p>
            {% else %}
            <p class="label">Player "{{ player_name }}" was not found in this session.</p>
            {% endif %}

            <a class="link" href="/leaderboard/{{ session.pin }}/">Show leaderboard</a>
        </div>
    </div>
</body>
</html>
