<!DOCTYPE html>
<html>
<head>
    <title>RESET PASSWORD</title>

    <style>
        body{
            background:#1900A8;
            font-family:Arial;
        }

        h1{
            color:#EFDD30;
            text-align:center;
            margin-top:80px;
        }

        form{
            width:300px;
            margin:40px auto;
            background:#2a2fff;
            padding:20px;
            border-radius:10px;
            color:white;
        }

        input{
            width:100%;
            margin:10px 0;
            padding:10px;
        }

        input[name="code"]{
            font-size:20px;
            text-align:center;
            letter-spacing:4px;
        }

        button{
            width:100%;
            padding:10px;
            background:#EFDD30;
            border:none;
            font-weight:bold;
            color:#1900A8;
        }

        p{
            text-align:center;
            color:white;
        }

        .error{
            color:red;
        }

        .dev-code{
            width:300px;
            margin:20px auto;
            padding:18px;
            background:#EFDD30;
            color:#1900A8;
            border-radius:10px;
            text-align:center;
            font-size:32px;
            font-weight:bold;
            letter-spacing:4px;
        }

        a{
            color:white;
        }

        footer{
            margin-top: 40px;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>RESET PASSWORD</h1>

<p>{{ message }}</p>

{% if dev_code %}
<div class="dev-code">{{ dev_code }}</div>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input name="code" placeholder="CODE" maxlength="6" required>
    <input name="password" type="password" placeholder="new password" required>
    <input name="password_confirm" type="password" placeholder="repeat password" required>
    <button>RESET PASSWORD</button>
</form>

<p><a href="{% url 'forgot_password' %}">Send another code</a></p>

<footer>
    <a href="{% url 'home_page' %}">home</a>
</footer>

</body>
</html>
