<!DOCTYPE html>
<html>
<head>
    <title>Host Quiz</title>
        <style>
        a {
            font-size: 20px;
            color: white;
        }
        h1 {
            text-align: center;
            color: #EFDD30;
        }
        body {
            background-color: #1900A8;
            font-family: Arial, sans-serif;
        }
        div {
            color: #4D62F5;
            margin: 40px;
            position: relative;
        }
        footer {
            position: relative;
            top: 550px;
        }
        /* Styl pro formulář */
        #join-form {
            max-width: 400px;
            margin: 80px auto;
            background-color: #2a2aff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            color: white;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #join-form input {
            font-size: 18px;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        #join-form button {
            font-size: 20px;
            background-color: #EFDD30;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            color: #1900A8;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        #join-form button:hover {
            background-color: #d4c92a;
        }
    </style>
</head>
<body>
    <h1>Hosting: {{ quiz.title }}</h1>
<h2>Your game PIN: {{ session.pin }}</h2>

<h3>Players connected:</h3>
<ul id="players-list">
    {% for player in players %}
    <li>{{ player.name }}</li>
    {% endfor %}
</ul>

<button id="start-btn">Start Game</button>

<script>
    const sessionPin = "{{ session.pin }}";
    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${protocol}://${window.location.host}/ws/quiz/${sessionPin}/`);

    const playersList = document.getElementById('players-list');
    const startBtn = document.getElementById('start-btn');

    function renderPlayers(players) {
        playersList.innerHTML = "";

        players.forEach(name => {
            const li = document.createElement("li");
            li.textContent = name;
            playersList.appendChild(li);
        });
    }

    async function refreshPlayers() {
        try {
            const response = await fetch(`/sessions/${sessionPin}/players/`);
            if (!response.ok) {
                return;
            }

            const data = await response.json();
            renderPlayers(data.players || []);
        } catch (error) {
            console.error("Failed to load players:", error);
        }
    }

    ws.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === "players_update") {
            renderPlayers(data.players || []);
        }

        if (data.type === "start") {
            window.location.href = `/game/${data.session_pin || sessionPin}/`;
        }
    };

    startBtn.onclick = function() {
        ws.send(JSON.stringify({
            type: "start"
        }));
    };

    refreshPlayers();
    window.setInterval(refreshPlayers, 2000);
</script>
</body>
</html>
