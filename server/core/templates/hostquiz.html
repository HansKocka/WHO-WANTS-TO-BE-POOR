<!DOCTYPE html>
<html>
<head>
    <title>Host Quiz</title>
        <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: #1900A8;
            font-family: Arial, sans-serif;
            color: #EFDD30;
        }

        .host-screen {
            width: min(760px, calc(100% - 32px));
            margin: 64px auto;
            text-align: center;
        }

        h1 {
            margin: 0 0 18px;
            color: #EFDD30;
            font-size: clamp(42px, 8vw, 72px);
            line-height: 1;
            font-weight: 900;
        }

        h2 {
            margin: 0 0 28px;
            color: #EFDD30;
            font-size: clamp(34px, 7vw, 62px);
            font-weight: 900;
        }

        h3 {
            margin: 0 0 16px;
            color: #EFDD30;
            font-size: clamp(26px, 5vw, 42px);
            font-weight: 900;
        }

        #players-list {
            margin: 0 auto 32px;
            padding: 0;
            list-style: none;
            color: #EFDD30;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: 800;
        }

        #players-list li {
            margin: 10px 0;
        }

        #start-btn {
            min-width: 240px;
            min-height: 70px;
            padding: 14px 28px;
            background: #EFDD30;
            color: #1900A8;
            border: 3px solid #EFDD30;
            border-radius: 8px;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 0 #0D0067;
            transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }

        #start-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #0D0067;
        }

        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0D0067;
        }
        /* Styl pro formulář */
        #join-form {
            max-width: 400px;
            margin: 80px auto;
            background-color: #2a2aff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            color: white;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #join-form input {
            font-size: 18px;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        #join-form button {
            font-size: 20px;
            background-color: #EFDD30;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            color: #1900A8;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        #join-form button:hover {
            background-color: #d4c92a;
        }
        footer {
            padding: 24px;
            text-align: center;
        }
        .home-button {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 400;
        }
    </style>
</head>
<body>
<main class="host-screen">
    <h1>Hosting: {{ quiz.title }}</h1>
    <h2>Your game PIN: {{ session.pin }}</h2>

    <h3>Players connected:</h3>
    <ul id="players-list">
        {% for player in players %}
        <li>{{ player.name }}</li>
        {% endfor %}
    </ul>

    <button id="start-btn">Start Game</button>
</main>

<footer>
    <a class="home-button" href="{% url 'home_page' %}">home</a>
</footer>

<script>
    const sessionPin = "{{ session.pin }}";
    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${protocol}://${window.location.host}/ws/quiz/${sessionPin}/`);

    const playersList = document.getElementById('players-list');
    const startBtn = document.getElementById('start-btn');

    function renderPlayers(players) {
        playersList.innerHTML = "";

        players.forEach(name => {
            const li = document.createElement("li");
            li.textContent = name;
            playersList.appendChild(li);
        });
    }

    async function refreshPlayers() {
        try {
            const response = await fetch(`/sessions/${sessionPin}/players/`);
            if (!response.ok) {
                return;
            }

            const data = await response.json();
            renderPlayers(data.players || []);
        } catch (error) {
            console.error("Failed to load players:", error);
        }
    }

    ws.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === "players_update") {
            renderPlayers(data.players || []);
        }

        if (data.type === "start") {
            window.location.href = `/game/${data.session_pin || sessionPin}/`;
        }
    };

    startBtn.onclick = function() {
        ws.send(JSON.stringify({
            type: "start"
        }));
    };

    refreshPlayers();
    window.setInterval(refreshPlayers, 2000);
</script>
</body>
</html>
