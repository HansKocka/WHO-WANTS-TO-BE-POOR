<!DOCTYPE html>
<html>
<head>
    <title>LOGIN</title>

    <style>
        body{
            background:#1900A8;
            font-family:Arial;
        }

        h1{
            color:#EFDD30;
            text-align:center;
            margin-top:80px;
        }

        form{
            width:300px;
            margin:40px auto;
            background:#2a2fff;
            padding:20px;
            border-radius:10px;
            color:white;
        }

        input{
            width:100%;
            margin:10px 0;
            padding:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:#EFDD30;
            border:none;
            font-weight:bold;
        }

        p{
            text-align:center;
            color:red;
        }

        a{
            color:white;
        }

        footer{
            margin-top: 40px;
            padding: 24px;
            text-align: center;
        }

        .home-button{
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 400;
        }
    </style>
</head>

<body>

<h1>LOGIN</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input name="username" placeholder="username" required>
    <input name="password" type="password" placeholder="password" required>
    <button>LOGIN</button>
</form>

<p><a href="{% url 'register' %}">Create account</a></p>
<p><a href="{% url 'forgot_password' %}">Forgot password?</a></p>

<footer>
    <a class="home-button" href="{% url 'home_page' %}">home</a>
</footer>

</body>
</html>
